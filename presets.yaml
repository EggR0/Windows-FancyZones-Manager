# FancyZones Hotkeys Configuration File
# -------------------------------------
# Note: You can reload these settings without restarting the application 
# by using the "Reload Settings" option in the system tray menu.

settings:
  # Enable automatic generation of hotkeys (Alt+1 ~ Alt+N) for all zones across all active monitors.
  # When set to true, the application reads your PowerToys layouts and automatically 
  # assigns sequential hotkeys to every zone across all your displays.
  # Default is false.
  auto-generate-hotkeys: false

# You can define reusable layout targets here.
targets:
  - id: left-main
    action: zone
    monitor: 1
    layout: '@applied'
    zone: 1
  
  - id: center-main
    action: zone
    monitor: 1
    layout: '@applied'
    zone: 2
    
  - id: right-main
    action: zone
    monitor: 1
    layout: '@applied'
    zone: 3
    
  - id: quad-top-left
    action: zone
    monitor: 2
    layout: '@applied'
    zone: 1

# Explicit hotkey assignments.
presets:
  # ----------------------------------------------------
  # Example: Snap window to Zone 1 on the Active Monitor
  # ----------------------------------------------------
  - hotkey: Alt+1
    action: zone
    monitor: active
    layout: '@applied'
    zone: 1
    
  - hotkey: Alt+2
    action: zone
    monitor: active
    layout: '@applied'
    zone: 2
    
  - hotkey: Alt+3
    action: zone
    monitor: active
    layout: '@applied'
    zone: 3

  # ----------------------------------------------------
  # Example: Move window to Next/Previous Monitor
  # ----------------------------------------------------
  - hotkey: Alt+Shift+Right
    action: monitor
    monitor: next
    placement: preserve-relative

  - hotkey: Alt+Shift+Left
    action: monitor
    monitor: previous
    placement: preserve-relative

  # ----------------------------------------------------
  # Example: Map hotkeys to predefined 'targets'
  # ----------------------------------------------------
  - hotkey: Ctrl+Alt+1
    target: left-main
    
  - hotkey: Ctrl+Alt+2
    target: center-main
    
  - hotkey: Ctrl+Alt+3
    target: right-main
    
  - hotkey: Ctrl+Alt+Q
    target: quad-top-left
