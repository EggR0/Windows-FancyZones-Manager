# FancyZones Hotkeys 설정 파일
# -------------------------------------
# 참고: 시스템 트레이 메뉴의 "Reload Settings(설정 다시 불러오기)" 
# 옵션을 사용하면 프로그램을 재시작하지 않고도 이 설정을 다시 불러올 수 있습니다.

settings:
  # 활성화된 모든 모니터의 전체 구역에 대해 단축키(Alt+1 ~ Alt+N)를 자동으로 생성합니다.
  # true로 설정하면, 프로그램이 PowerToys 레이아웃을 읽어들여 
  # 모든 디스플레이의 각 구역마다 순차적으로 단축키를 자동 할당합니다.
  # 기본값은 false 입니다.
  auto-generate-hotkeys: false

# 이 곳에 재사용 가능한 레이아웃 타겟을 정의할 수 있습니다.
targets:
  - id: left-main
    action: zone
    monitor: 1
    layout: '@applied'
    zone: 1
  
  - id: center-main
    action: zone
    monitor: 1
    layout: '@applied'
    zone: 2
    
  - id: right-main
    action: zone
    monitor: 1
    layout: '@applied'
    zone: 3
    
  - id: quad-top-left
    action: zone
    monitor: 2
    layout: '@applied'
    zone: 1

# 명시적인 단축키 할당을 정의합니다.
presets:
  # =========================================================================================
  # [ 사용 가능한 옵션 총정리 ]
  # =========================================================================================
  # 1) hotkey: 사용하고 싶은 단축키 (예: Alt+1, Ctrl+Shift+Right 등)
  #
  # 2) action: 어떤 작업을 할 것인지 결정
  #    - zone    : 특정 모니터의 특정 구역(Zone)으로 창을 이동시킵니다.
  #    - monitor : 특정 모니터로 창을 보내고 화면에서의 배치 방식을 결정합니다.
  #
  # 3) monitor: 창을 보낼 모니터 지정 (action이 zone이든 monitor이든 사용)
  #    - active   : 현재 창이 있는 활성화된 모니터
  #    - next     : 다음 모니터로 이동
  #    - previous : 이전 모니터로 이동
  #    - 1, 2, 3..: 특정 모니터 번호 (디스플레이 설정 기준)
  #
  # 4) [ action: zone 일 때 사용하는 옵션 ]
  #    - layout : '@applied' (현재 적용된 레이아웃) 또는 레이아웃 ID
  #    - zone   : 이동할 구역 번호 (1, 2, 3...)
  #
  # 5) [ action: monitor 일 때 사용하는 옵션 ]
  #    - placement: 모니터로 넘긴 후 창을 어떻게 배치할 것인가?
  #        * maximize          : 화면에 꽉 차게 최대화 (전체 화면)
  #        * fill              : 진짜 최대화 상태로 바꾸지 않고, 창 크기만 모니터 꽉 차게 늘림
  #        * center            : 창 크기를 유지하며 화면 정중앙에 배치
  #        * preserve-size     : 기존 창 크기를 그대로 유지
  #        * preserve-relative : 기존 모니터에서의 상대적인 위치와 비율을 유지 (기본값)
  #        * top-left          : 좌측 상단 구석에 배치
  #        * custom            : 직접 지정한 x, y, width, height 값으로 배치
  #            (custom 사용 시 아래 속성 추가 필요)
  #            - x, y, width, height: 픽셀 단위 좌표 및 크기
  # =========================================================================================

  # ----------------------------------------------------
  # 예시 1: 현재 모니터의 1번 구역으로 창 스냅하기 (action: zone)
  # ----------------------------------------------------
  - hotkey: Alt+1
    action: zone
    monitor: active
    layout: '@applied'
    zone: 1
    
  - hotkey: Alt+2
    action: zone
    monitor: active
    layout: '@applied'
    zone: 2

  # ----------------------------------------------------
  # 예시 2: 창을 다음/이전 모니터로 이동하기 (비율 유지)
  # ----------------------------------------------------
  - hotkey: Alt+Shift+Right
    action: monitor
    monitor: next
    placement: preserve-relative

  - hotkey: Alt+Shift+Left
    action: monitor
    monitor: previous
    placement: preserve-relative

  # ----------------------------------------------------
  # 예시 3: 창을 특정 모니터(2번)로 보낸 후 전체 화면으로 꽉 채우기 (최대화)
  # ----------------------------------------------------
  - hotkey: Ctrl+Alt+F
    action: monitor
    monitor: 2
    placement: maximize

  # ----------------------------------------------------
  # 예시 4: 창을 특정 모니터(1번) 정중앙에 배치 (크기 유지)
  # ----------------------------------------------------
  - hotkey: Ctrl+Alt+C
    action: monitor
    monitor: 1
    placement: center

  # ----------------------------------------------------
  # 예시 5: 특정 모니터(2번)에 정확한 좌표와 크기로 커스텀 배치
  # ----------------------------------------------------
  - hotkey: Ctrl+Alt+M
    action: monitor
    monitor: 2
    placement: custom
    x: 100
    y: 100
    width: 1280
    height: 720

  # ----------------------------------------------------
  # 예시 6: 미리 정의해둔 'targets(타겟)' 불러와서 사용하기
  # ----------------------------------------------------
  - hotkey: Ctrl+Alt+1
    target: left-main
    
  - hotkey: Ctrl+Alt+Q
    target: quad-top-left
